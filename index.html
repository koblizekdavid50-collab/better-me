<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Better Me</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6750a4">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --primary:#6750a4;
  --primary-container:#eaddff;
  --surface:#fffbfe;
  --surface-container:#f3edf7;
  --outline:#79747e;
  --text:#1d1b20;
  --muted:#79747e;
  --line:rgba(73,69,79,.10);
  --shadow:0 3px 12px rgba(29,27,32,.055);
  font-family:Roboto,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  background:#f6f2f7;
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
}

.app{
  width:100%;
  max-width:none;
  min-width:0;
  min-height:100vh;
  margin:0;
  padding:0 12px 100px;
  background:#f6f2f7;
  color:#1d1b20;
}

.top{
  position:sticky;
  top:0;
  z-index:30;

  width:calc(100% + 24px);
  margin-left:-12px;
  margin-right:-12px;

  min-height:68px;
  padding:10px 12px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  background:rgba(246,242,247,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(73,69,79,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.brand-mark{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#7658c9,#5d42a0);
  color:#fff;
  font-weight:900;
  font-size:21px;
  box-shadow:0 5px 14px rgba(103,80,164,.25);
}

.title{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
}

.sub{
  font-size:12px;
  color:#79747e;
  margin-top:2px;
}

.icon-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  padding:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  color:#49454f;
  font-size:23px;
}

.icon-btn:hover{
  background:#ece6f0;
}

.card,
.section{
  width:100%;
  max-width:100%;
  min-width:0;
  margin:12px 0;
  padding:16px;
  background:#fffbfe;
  border:1px solid rgba(73,69,79,.10);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.section h2,
.card h2{
  font-size:18px;
  margin:0 0 8px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  width:100%;
  min-width:0;
}

.row > *{
  min-width:0;
  max-width:100%;
}

.grid{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.small{
  font-size:12px;
  color:#79747e;
}

.progress{
  width:100%;
  height:10px;
  margin-top:9px;
  background:#e7e0ea;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6750a4,#8066bd);
  border-radius:999px;
  transition:.2s;
}

.check{
  width:100%;
  min-width:0;
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 4px;
  border-bottom:1px solid #eee9ef;
  font-size:14px;
  line-height:1.35;
}

.check:last-child{
  border-bottom:0;
}

.check input{
  width:22px;
  height:22px;
  flex:0 0 22px;
  margin:0;
  accent-color:#6750a4;
}

.check span{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

textarea,
input[type=text],
input[type=number],
input[type=time],
input[type=date],
select{
  width:100%;
  max-width:100%;
  min-width:0;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid #cac4d0;
  background:#f7f2fa;
  color:#1d1b20;
  font:inherit;
  font-size:14px;
}

textarea{
  margin:4px 0 8px;
  resize:vertical;
}

.btn{
  border:1px solid #79747e;
  background:#fffbfe;
  color:#49454f;
  border-radius:999px;
  padding:10px 14px;
  min-height:40px;
  max-width:100%;
  white-space:normal;
}

.btn:active{
  transform:scale(.98);
}

.score{
  font-size:34px;
  font-weight:800;
  color:#6750a4;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  margin:2px;
  border-radius:999px;
  background:#eaddff;
  color:#21005d;
  font-size:12px;
}

.settings-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px;
  gap:8px;
  align-items:center;
  margin:10px 0;
}

.settings-row input{
  padding:9px;
}

.calendar{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
}

.calhead{
  min-width:0;
  font-size:10px;
  text-align:center;
  color:#79747e;
  padding:3px;
}

.day{
  min-width:0;
  width:100%;
  min-height:45px;
  border:1px solid #e4dfe6;
  border-radius:8px;
  padding:5px;
  font-size:11px;
  overflow:hidden;
  background:#fffbfe;
}

.day.empty{
  border:0;
  background:transparent;
}

.day.today{
  outline:2px solid #6750a4;
}

.day.done{
  background:#eaddff;
}

.day .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#6750a4;
  display:inline-block;
  margin-left:2px;
}

.stat{
  font-size:24px;
  font-weight:800;
}

#content{
  width:100%;
  min-width:0;
}

/* Bottom navigation */
.nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  max-width:none;
  min-width:0;

  height:76px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));

  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;

  background:rgba(255,251,254,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(73,69,79,.10);
  box-shadow:0 -4px 18px rgba(29,27,32,.07);
}

.nav button{
  min-width:0;
  width:100%;
  border-radius:16px;
  padding:7px 3px;
  background:transparent;
  color:#49454f;
  font-size:11px;
  font-weight:700;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;

  overflow:hidden;
}

.nav button.active{
  background:#eaddff;
  color:#21005d;
}

.nav button:nth-child(1)::before{
  content:'⌂';
  font-size:17px;
}

.nav button:nth-child(2)::before{
  content:'🏋️';
  font-size:16px;
}

.nav button:nth-child(3)::before{
  content:'✓';
  font-size:17px;
}

.nav button:nth-child(4)::before{
  content:'▥';
  font-size:17px;
}

.nav button:nth-child(5)::before{
  content:'☰';
  font-size:17px;
}

/* Mobile */
@media(max-width:600px){

  .app{
    width:100%;
    max-width:none;
    margin:0;
    padding-left:10px;
    padding-right:10px;
    padding-bottom:100px;
  }

  .top{
    width:calc(100% + 20px);
    margin-left:-10px;
    margin-right:-10px;
    padding-left:10px;
    padding-right:10px;
  }

  .card,
  .section{
    border-radius:18px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* Very small phones */
@media(max-width:430px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card,
  .section{
    padding:14px;
  }

  .title{
    font-size:19px;
  }

  .settings-row{
    grid-template-columns:minmax(0,1fr) 90px;
  }
}

/* Dark mode */
@media(prefers-color-scheme:dark){

  :root{
    --surface:#211f26;
    --text:#e6e1e9;
    --muted:#cac4d0;
    --line:rgba(230,225,233,.09);
  }

  body{
    background:#141218;
    color:#e6e1e9;
  }

  .app{
    background:#141218;
    color:#e6e1e9;
  }

  .top{
    background:rgba(20,18,24,.94);
    border-bottom-color:rgba(230,225,233,.08);
  }

  .title{
    color:#e6e1e9;
  }

  .sub,
  .small{
    color:#cac4d0;
  }

  .icon-btn{
    color:#cac4d0;
  }

  .card,
  .section{
    background:#211f26;
    border-color:rgba(230,225,233,.09);
  }

  .check{
    border-bottom-color:#302d35;
  }

  .btn{
    background:#211f26;
    color:#e6e1e9;
    border-color:#938f99;
  }

  textarea,
  input[type=text],
  input[type=number],
  input[type=time],
  input[type=date],
  select{
    background:#1c1a20;
    color:#e6e1e9;
    border-color:#49454f;
  }

  .progress{
    background:#38343e;
  }

  .day{
    background:#211f26;
    border-color:#3a363f;
  }

  .day.done{
    background:#4f378b55;
  }

  .nav{
    background:rgba(33,31,38,.96);
    border-top-color:rgba(230,225,233,.08);
  }

  .nav button{
    color:#cac4d0;
  }

  .nav button.active{
    background:#4f378b;
    color:#fff;
  }

  .pill{
    background:#4f378b;
    color:#fff;
  }

  .stat{
    color:#eaddff;
  }
}

  /* FINAL PHONE WIDTH FIX */
html, body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow-x: hidden !important;
}

.app {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding-left: 10px !important;
  padding-right: 10px !important;
}

.top {
  width: calc(100% + 20px) !important;
  max-width: none !important;
  margin-left: -10px !important;
  margin-right: -10px !important;
}

.nav {
  width: 100% !important;
  max-width: none !important;
  left: 0 !important;
  right: 0 !important;
  transform: none !important;
}
</style>
</head>

<body>

<main class="app">

  <div class="top">
    <div class="brand">
      <div class="brand-mark">✓</div>
      <div>
        <div class="title">Better Me</div>
        <div class="sub" id="date"></div>
      </div>
    </div>

    <button class="icon-btn" aria-label="Reset today" onclick="resetToday()">↻</button>
  </div>

  <div class="nav" id="nav"></div>

  <div id="content"></div>

</main>

<script>

const KEY='sir-v2';

const todayKey=()=>{
  return new Date().toLocaleDateString('en-CA');
};

let db=JSON.parse(localStorage.getItem(KEY)||'null');

const DEFAULT_SECTIONS={

Today:[

[
'Morning',
[
'Tongue scraper + 2 min fluoride brushing',
'Gentle cleanser + moisturizer + SPF 30–50',
'SPF lip balm',
'Bible 10–20 min + prayer'
]
],

[
'During the day',
[
'Relaxed posture + regular movement',
'Reapply lip balm/SPF outdoors',
'Water after acidic/sugary drinks',
'Kind, respectful, honest, responsible, reliable, humble, forgiving, self-controlled',
'Recognize → Redirect → Pray → Move on',
'Handle mistakes: recognize → admit → apologize → fix → learn → move forward',
'Complete school/work responsibilities',
'Treat family, friends and others well',
'Make time for something enjoyable'
]
],

[
'After lunch',
[
'Water + xylitol gum 10–20 min OR alcohol-free fluoride mouthwash'
]
],

[
'Teeth',
[
'Morning brush',
'Tongue scraper',
'Floss',
'Evening brush',
'Mouthwash/gum after lunch'
]
],

[
'Face & lips',
[
'Morning routine',
'SPF',
'Evening routine',
'Salicylic acid if scheduled',
'Lips cared for'
]
],

[
'Hair',
[
'Correct shampoo',
'Conditioner',
'Gentle scalp care'
]
],

[
'Sleep',
[
'Aim for 8–10 hours',
'Eat enough + normally hydrate'
]
]

],

Training:[

[
'Strength A + posture',
[
'Squat/goblet squat — 3×8–12',
'Push-up/bench press — 3×8–15',
'Pull-up/row — 3×6–12',
'Romanian deadlift — 3×8–12',
'Chin tucks — 2×10',
'Wall angels — 2×8–10'
]
],

[
'Strength B + posture',
[
'Lunges — 2×8–12/leg',
'Shoulder press — 3×8–12',
'Pull-up/row — 3×6–12',
'Romanian deadlift — 3×8–12',
'Plank — 2–3×30–60 sec',
'Bird dogs — 2×8/side',
'Doorway chest stretch — 2×20–30 sec'
]
],

[
'Weekly schedule',
[
'Monday — Strength A + posture',
'Tuesday — Strength B + posture',
'Wednesday — Athletic activity',
'Thursday — Strength B + posture',
'Friday — Rest / light movement',
'Saturday — Strength A + posture',
'Sunday — Rest'
]
],

[
'Rules',
[
'Progress gradually',
'Prioritize good technique',
'Don’t train the same muscles hard every day',
'Don’t force rigid posture'
]
]

],

Reflection:[

[
'Food',
[
'Breakfast',
'Lunch',
'Dinner',
'Snacks',
'Water'
]
],

[
'Training',
[
'What did I do today?',
'Sets/reps or activity',
'Anything to remember for next time?'
]
],

[
'Posture & movement',
[
'Anything I noticed today?'
]
],

[
'Spiritual',
[
'Bible minutes',
'What stood out to me?'
]
],

[
'Character, purity & growth',
[
'When did I show good character?',
'When did I fail to be kind, respectful, honest, responsible, humble, forgiving or self-controlled?',
'Did I treat people with dignity?',
'Who did I help?',
'Did I intentionally seek sexual content?',
'What situations, thoughts or habits made purity difficult?',
'What helped me redirect?',
'What mistake did I make?',
'Did I take responsibility and try to fix it?',
'Do I owe someone an apology?',
'What did I learn?',
'What needs improvement, and what will I do differently tomorrow?'
]
],

[
'Gratitude',
[
'What am I thankful for?'
]
],

[
'Tomorrow',
[
'Wake-up and bedtime goals',
'Training, meals/snacks and water goal',
'Important tasks, forgotten tasks, preparation and people to talk to/help',
'Character trait and personal improvement',
'How will I grow closer to God?'
]
]

]

};

if(!db || !db.days){

  db={
    days:{},
    settings:{
      reminders:{
        morning:'07:00',
        lunch:'12:30',
        evening:'20:30',
        bed:'22:00'
      },
      notifications:false
    },
    customSections:null
  };

}

if(!db.customSections){
  db.customSections=JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
}

let today=todayKey();

if(!db.days[today]){
  db.days[today]=newDay();
  save();
}

let tab='Today';

function newDay(){
  return {
    checks:{},
    notes:{},
    score:'',
    created:Date.now()
  };
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(db));
}

function day(){
  return db.days[today];
}

const sections=db.customSections;

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#039;'
  }[m]));
}

function idFor(tab,name,item){
  return tab+'|'+name+'|'+item;
}

function renderNav(){

  const items=[
    ['Today','Today'],
    ['Training','Training'],
    ['Reflection','Reflection'],
    ['Insights','Insights'],
    ['More','More']
  ];

  nav.innerHTML=items.map(([x,label])=>`
    <button
      class="${tab===x?'active':''}"
      onclick="tab='${x}';render()">
      ${label}
    </button>
  `).join('');

}

function allChecks(d){
  return Object.values(d.checks||{});
}

function progress(d){

  let v=allChecks(d);
  let done=v.filter(Boolean).length;
  let total=Math.max(v.length,1);

  return {
    done,
    total,
    pct:Math.round(done/total*100)
  };

}

function render(){

  renderNav();

  date.textContent=new Date().toLocaleDateString(
    undefined,
    {
      weekday:'long',
      month:'long',
      day:'numeric'
    }
  );

  if(tab==='Insights'){
    renderInsights();
    return;
  }

  if(tab==='Calendar'){
    renderCalendar();
    return;
  }

  if(tab==='Reminders'){
    renderReminders();
    return;
  }

  if(tab==='More'){
    renderMore();
    return;
  }

  let html='';
  let d=day();

  if(tab==='Today'){

    let p=progress(d);

    html+=`
      <div
        class="card"
        style="
          background:linear-gradient(135deg,#6750a4,#8066bd)!important;
          color:#fff!important;
          border:0!important;
        "
      >
        <div style="font-size:13px;opacity:.82">TODAY</div>

        <div style="
          font-size:25px;
          font-weight:800;
          margin-top:3px;
        ">
          Keep going 💪
        </div>

        <div
          class="row"
          style="margin-top:16px"
        >
          <b>Daily progress</b>
          <b>${p.pct}%</b>
        </div>

        <div class="progress">
          <div
            class="bar"
            style="width:${p.pct}%"
          ></div>
        </div>

        <p
          class="small"
          style="color:#fff!important"
        >
          ${p.done}/${p.total} checklist items completed
        </p>

      </div>
    `;
  }

  for(const [name,items] of (sections[tab]||[])){

    html+=`
      <div class="card section">
        <h2>${esc(name)}</h2>
    `;

    for(const item of items){

      let id=idFor(tab,name,item);

      if(tab==='Reflection'){

        html+=`
          <label class="check">
            <span>${esc(item)}</span>
          </label>

          <textarea
            rows="2"
            placeholder="Write here..."
            data-note="${esc(id)}"
            oninput="
              day().notes[this.dataset.note]=this.value;
              save()
            "
          >${esc(d.notes[id]||'')}</textarea>
        `;

      }else{

        html+=`
          <label class="check">

            <input
              type="checkbox"
              ${d.checks[id]?'checked':''}
              onchange="
                day().checks['${esc(id)}']=this.checked;
                save();
                render()
              "
            >

            <span>${esc(item)}</span>

          </label>
        `;

      }

    }

    html+='</div>';

  }

  if(tab==='Reflection'){

    html+=`
      <div class="card">

        <h2>⭐ Daily effort</h2>

        <div class="row">

          <div class="score">
            ${d.score||'—'}/10
          </div>

          <input
            type="number"
            min="0"
            max="10"
            value="${esc(d.score)}"
            placeholder="0–10"
            onchange="
              day().score=this.value;
              save();
              render()
            "
          >

        </div>

        <div class="small">
          Score your effort and consistency,
          not your worth or perfection.
        </div>

      </div>
    `;
  }

  content.innerHTML=html;

}

function renderInsights(){

  let keys=Object.keys(db.days).sort();
  let recent=keys.slice(-14);

  let scores=recent.map(
    k=>Number(db.days[k].score)||0
  );

  let streak=calcStreak();
  let p=progress(day());

  let avg=scores.length
    ? scores.reduce((a,b)=>a+b,0)/scores.length
    : 0;

  let best=Math.max(0,...scores);

  content.innerHTML=`

    <div class="grid">

      <div class="card">
        <div class="small">Current streak</div>
        <div class="stat">
          🔥 ${streak} day${streak===1?'':'s'}
        </div>
      </div>

      <div class="card">
        <div class="small">Today</div>
        <div class="stat">${p.pct}%</div>
      </div>

      <div class="card">
        <div class="small">14-day avg effort</div>
        <div class="stat">${avg.toFixed(1)}/10</div>
      </div>

      <div class="card">
        <div class="small">Best effort</div>
        <div class="stat">${best}/10</div>
      </div>

    </div>

    <div class="card">

      <h2>Last 14 days</h2>

      <div
        style="
          height:180px;
          display:flex;
          align-items:end;
          gap:6px;
          width:100%;
        "
      >

        ${recent.map(k=>{

          let s=Number(db.days[k].score)||0;
          let pct=s*10;

          return `
            <div
              title="${k}: ${s}/10"
              style="
                flex:1;
                height:${Math.max(4,pct)}%;
                background:#6d5dfc;
                border-radius:7px 7px 0 0;
                min-width:8px;
              "
            ></div>
          `;

        }).join('')}

      </div>

      <div
        class="small"
        style="
          display:flex;
          justify-content:space-between;
          margin-top:8px;
        "
      >
        <span>${recent[0]||''}</span>
        <span>${recent[recent.length-1]||''}</span>
      </div>

    </div>

    <div class="card">

      <h2>Consistency</h2>

      <p>
        Streaks count consecutive days where you
        completed at least one checklist item.
        Your score is an effort score, not a measure
        of your worth.
      </p>

    </div>

  `;

}

function calcStreak(){

  let n=0;
  let d=new Date();

  while(true){

    let k=d.toLocaleDateString('en-CA');
    let x=db.days[k];

    if(!x || !allChecks(x).some(Boolean)){

      if(n===0 && k===today){
        n=0;
      }

      break;
    }

    n++;

    d.setDate(d.getDate()-1);

  }

  return n;

}
