<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Better Me</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6750a4">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --primary:#6750a4;
  --primary-container:#eaddff;
  --surface:#fffbfe;
  --surface-container:#f3edf7;
  --outline:#79747e;
  --text:#1d1b20;
  --muted:#79747e;
  --line:rgba(73,69,79,.10);
  --shadow:0 3px 12px rgba(29,27,32,.055);
  font-family:Roboto,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  background:#f6f2f7;
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
}

.app{
  width:100%;
  max-width:none;
  min-width:0;
  min-height:100vh;
  margin:0;
  padding:0 12px 100px;
  background:#f6f2f7;
  color:#1d1b20;
}

.top{
  position:sticky;
  top:0;
  z-index:30;

  width:calc(100% + 24px);
  margin-left:-12px;
  margin-right:-12px;

  min-height:68px;
  padding:10px 12px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  background:rgba(246,242,247,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(73,69,79,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.brand-mark{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#7658c9,#5d42a0);
  color:#fff;
  font-weight:900;
  font-size:21px;
  box-shadow:0 5px 14px rgba(103,80,164,.25);
}

.title{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
}

.sub{
  font-size:12px;
  color:#79747e;
  margin-top:2px;
}

.icon-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  padding:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  color:#49454f;
  font-size:23px;
}

.icon-btn:hover{
  background:#ece6f0;
}

.card,
.section{
  width:100%;
  max-width:100%;
  min-width:0;
  margin:12px 0;
  padding:16px;
  background:#fffbfe;
  border:1px solid rgba(73,69,79,.10);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.section h2,
.card h2{
  font-size:18px;
  margin:0 0 8px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  width:100%;
  min-width:0;
}

.row > *{
  min-width:0;
  max-width:100%;
}

.grid{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.small{
  font-size:12px;
  color:#79747e;
}

.progress{
  width:100%;
  height:10px;
  margin-top:9px;
  background:#e7e0ea;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6750a4,#8066bd);
  border-radius:999px;
  transition:.2s;
}

.check{
  width:100%;
  min-width:0;
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 4px;
  border-bottom:1px solid #eee9ef;
  font-size:14px;
  line-height:1.35;
}

.check:last-child{
  border-bottom:0;
}

.check input{
  width:22px;
  height:22px;
  flex:0 0 22px;
  margin:0;
  accent-color:#6750a4;
}

.check span{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

textarea,
input[type=text],
input[type=number],
input[type=time],
input[type=date],
select{
  width:100%;
  max-width:100%;
  min-width:0;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid #cac4d0;
  background:#f7f2fa;
  color:#1d1b20;
  font:inherit;
  font-size:14px;
}

textarea{
  margin:4px 0 8px;
  resize:vertical;
}

.btn{
  border:1px solid #79747e;
  background:#fffbfe;
  color:#49454f;
  border-radius:999px;
  padding:10px 14px;
  min-height:40px;
  max-width:100%;
  white-space:normal;
}

.btn:active{
  transform:scale(.98);
}

.score{
  font-size:34px;
  font-weight:800;
  color:#6750a4;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  margin:2px;
  border-radius:999px;
  background:#eaddff;
  color:#21005d;
  font-size:12px;
}

.settings-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px;
  gap:8px;
  align-items:center;
  margin:10px 0;
}

.settings-row input{
  padding:9px;
}

.calendar{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
}

.calhead{
  min-width:0;
  font-size:10px;
  text-align:center;
  color:#79747e;
  padding:3px;
}

.day{
  min-width:0;
  width:100%;
  min-height:45px;
  border:1px solid #e4dfe6;
  border-radius:8px;
  padding:5px;
  font-size:11px;
  overflow:hidden;
  background:#fffbfe;
}

.day.empty{
  border:0;
  background:transparent;
}

.day.today{
  outline:2px solid #6750a4;
}

.day.done{
  background:#eaddff;
}

.day .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#6750a4;
  display:inline-block;
  margin-left:2px;
}

.stat{
  font-size:24px;
  font-weight:800;
}

#content{
  width:100%;
  min-width:0;
}

/* Bottom navigation */
.nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  max-width:none;
  min-width:0;

  height:76px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));

  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;

  background:rgba(255,251,254,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(73,69,79,.10);
  box-shadow:0 -4px 18px rgba(29,27,32,.07);
}

.nav button{
  min-width:0;
  width:100%;
  border-radius:16px;
  padding:7px 3px;
  background:transparent;
  color:#49454f;
  font-size:11px;
  font-weight:700;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;

  overflow:hidden;
}

.nav button.active{
  background:#eaddff;
  color:#21005d;
}

.nav button:nth-child(1)::before{
  content:'⌂';
  font-size:17px;
}

.nav button:nth-child(2)::before{
  content:'🏋️';
  font-size:16px;
}

.nav button:nth-child(3)::before{
  content:'✓';
  font-size:17px;
}

.nav button:nth-child(4)::before{
  content:'▥';
  font-size:17px;
}

.nav button:nth-child(5)::before{
  content:'☰';
  font-size:17px;
}

/* Mobile */
@media(max-width:600px){

  .app{
    width:100%;
    max-width:none;
    margin:0;
    padding-left:0;
    padding-right:0;
    padding-bottom:100px;
  }

  .top{
    width:calc(100% + 20px);
    margin-left:-10px;
    margin-right:-10px;
    padding-left:10px;
    padding-right:10px;
  }

  .card,
  .section{
    border-radius:18px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* Very small phones */
@media(max-width:430px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card,
  .section{
    padding:14px;
  }

  .title{
    font-size:19px;
  }

  .settings-row{
    grid-template-columns:minmax(0,1fr) 90px;
  }
}

/* Dark mode */
@media(prefers-color-scheme:dark){

  :root{
    --surface:#211f26;
    --text:#e6e1e9;
    --muted:#cac4d0;
    --line:rgba(230,225,233,.09);
  }

  body{
    background:#141218;
    color:#e6e1e9;
  }

  .app{
    background:#141218;
    color:#e6e1e9;
  }

  .top{
    background:rgba(20,18,24,.94);
    border-bottom-color:rgba(230,225,233,.08);
  }

  .title{
    color:#e6e1e9;
  }

  .sub,
  .small{
    color:#cac4d0;
  }

  .icon-btn{
    color:#cac4d0;
  }

  .card,
  .section{
    background:#211f26;
    border-color:rgba(230,225,233,.09);
  }

  .check{
    border-bottom-color:#302d35;
  }

  .btn{
    background:#211f26;
    color:#e6e1e9;
    border-color:#938f99;
  }

  textarea,
  input[type=text],
  input[type=number],
  input[type=time],
  input[type=date],
  select{
    background:#1c1a20;
    color:#e6e1e9;
    border-color:#49454f;
  }

  .progress{
    background:#38343e;
  }

  .day{
    background:#211f26;
    border-color:#3a363f;
  }

  .day.done{
    background:#4f378b55;
  }

  .nav{
    background:rgba(33,31,38,.96);
    border-top-color:rgba(230,225,233,.08);
  }

  .nav button{
    color:#cac4d0;
  }

  .nav button.active{
    background:#4f378b;
    color:#fff;
  }

  .pill{
    background:#4f378b;
    color:#fff;
  }

  .stat{
    color:#eaddff;
  }
}

  /* FINAL PHONE WIDTH FIX */
html, body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow-x: hidden !important;
}

.app {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding-left: 10px !important;
  padding-right: 10px !important;
}

.top {
  width: calc(100% + 20px) !important;
  max-width: none !important;
  margin-left: -10px !important;
  margin-right: -10px !important;
}

.nav {
  width: 100% !important;
  max-width: none !important;
  left: 0 !important;
  right: 0 !important;
  transform: none !important;
}
</style>
</head>

<body>

<main class="app">

  <div class="top">
    <div class="brand">
      <div class="brand-mark">✓</div>
      <div>
        <div class="title">Better Me</div>
        <div class="sub" id="date"></div>
      </div>
    </div>

    <button class="icon-btn" aria-label="Reset today" onclick="resetToday()">↻</button>
  </div>

  <div class="nav" id="nav"></div>

  <div id="content"></div>

</main>

<script>
