<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Self-Improvement</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6d5dfc">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee}.app{min-height:100vh;background:light-dark(#f6f7f9,#111827);color:light-dark(#172033,#eef2ff);padding:18px;max-width:950px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font-size:28px;font-weight:800}.sub{opacity:.7}.nav{display:flex;gap:8px;overflow:auto;margin:18px 0}.nav button,.btn{border:1px solid light-dark(#d7dce5,#374151);background:light-dark(#fff,#1f2937);color:inherit;border-radius:12px;padding:10px 14px;font-weight:650;white-space:nowrap}.nav button.active{background:#6d5dfc;color:white;border-color:#6d5dfc}.card{background:light-dark(#fff,#1b2433);border:1px solid light-dark(#e1e5ec,#303b4d);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000b}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:10px;background:light-dark(#e8ebf0,#303846);border-radius:99px;overflow:hidden}.bar{height:100%;background:#6d5dfc;width:0;transition:.2s}.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid light-dark(#edf0f4,#293243)}.check:last-child{border:0}.check input{width:20px;height:20px;margin-top:2px}.section h2{font-size:19px;margin:0 0 10px}.small{font-size:13px;opacity:.7}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}textarea,input[type=text],input[type=number],input[type=time],input[type=date]{width:100%;padding:11px;border-radius:11px;border:1px solid light-dark(#d7dce5,#374151);background:transparent;color:inherit}.score{font-size:38px;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:12px;opacity:.95}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calhead{font-size:12px;text-align:center;opacity:.6;padding:5px}.day{min-height:55px;border:1px solid light-dark(#e1e5ec,#303b4d);border-radius:10px;padding:6px;font-size:12px}.day.empty{border:0}.day.today{outline:2px solid #6d5dfc}.day.done{background:#6d5dfc22}.day .dot{width:8px;height:8px;border-radius:50%;background:#6d5dfc;display:inline-block;margin-left:3px}.stat{font-size:28px;font-weight:800}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#6d5dfc18;margin:3px}.settings-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;margin:10px 0}@media(max-width:600px){.app{padding:12px}.title{font-size:24px}.day{min-height:48px;padding:4px;font-size:11px}}
</style>
</head>
<body><main class="app">
<div class="top"><div><div class="title">Self-Improvement</div><div class="sub" id="date"></div></div><button class="btn" onclick="resetToday()">Reset today</button></div>
<div class="nav" id="nav"></div><div id="content"></div></main>
<script>
const KEY='sir-v2';
const todayKey=()=>new Date().toLocaleDateString('en-CA');
let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db||!db.days) db={days:{},settings:{reminders:{morning:'07:00',lunch:'12:30',evening:'20:30',bed:'22:00'},notifications:false}};
let today=todayKey(); if(!db.days[today]) db.days[today]=newDay(); save();
let tab='Today';
function newDay(){return {checks:{},notes:{},score:'',created:Date.now()}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function day(){return db.days[today]}
const sections={
Today:[['Morning',['Tongue scraper + 2 min fluoride brushing','Gentle cleanser + moisturizer + SPF 30–50','SPF lip balm','Bible 10–20 min + prayer']],['During the day',['Relaxed posture + regular movement','Reapply lip balm/SPF outdoors','Water after acidic/sugary drinks','Kind, respectful, honest, responsible, reliable, humble, forgiving, self-controlled','Recognize → Redirect → Pray → Move on','Handle mistakes: recognize → admit → apologize → fix → learn → move forward','Complete school/work responsibilities','Treat family, friends and others well','Make time for something enjoyable']],['After lunch',['Water + xylitol gum 10–20 min OR alcohol-free fluoride mouthwash']],['Teeth',['Morning brush','Tongue scraper','Floss','Evening brush','Mouthwash/gum after lunch']],['Face & lips',['Morning routine','SPF','Evening routine','Salicylic acid if scheduled','Lips cared for']],['Hair',['Correct shampoo','Conditioner','Gentle scalp care']],['Sleep',['Aim for 8–10 hours','Eat enough + normally hydrate']]],
Training:[['Strength A + posture',['Squat/goblet squat — 3×8–12','Push-up/bench press — 3×8–15','Pull-up/row — 3×6–12','Romanian deadlift — 3×8–12','Chin tucks — 2×10','Wall angels — 2×8–10']],['Strength B + posture',['Lunges — 2×8–12/leg','Shoulder press — 3×8–12','Pull-up/row — 3×6–12','Romanian deadlift — 3×8–12','Plank — 2–3×30–60 sec','Bird dogs — 2×8/side','Doorway chest stretch — 2×20–30 sec']],['Weekly schedule',['Monday — Strength A + posture','Tuesday — Strength B + posture','Wednesday — Athletic activity','Thursday — Strength B + posture','Friday — Rest / light movement','Saturday — Strength A + posture','Sunday — Rest']],['Rules',['Progress gradually','Prioritize good technique','Don’t train the same muscles hard every day','Don’t force rigid posture']]],
Reflection:[['Food',['Breakfast','Lunch','Dinner','Snacks','Water']],['Training',['What did I do today?','Sets/reps or activity','Anything to remember for next time?']],['Posture & movement',['Anything I noticed today?']],['Spiritual',['Bible minutes','What stood out to me?']],['Character, purity & growth',['When did I show good character?','When did I fail to be kind, respectful, honest, responsible, humble, forgiving or self-controlled?','Did I treat people with dignity?','Who did I help?','Did I intentionally seek sexual content?','What situations, thoughts or habits made purity difficult?','What helped me redirect?','What mistake did I make?','Did I take responsibility and try to fix it?','Do I owe someone an apology?','What did I learn?','What needs improvement, and what will I do differently tomorrow?']],['Gratitude',['What am I thankful for?']],['Tomorrow',['Wake-up and bedtime goals','Training, meals/snacks and water goal','Important tasks, forgotten tasks, preparation and people to talk to/help','Character trait and personal improvement','How will I grow closer to God?']]]};
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function idFor(tab,name,item){return tab+'|'+name+'|'+item}
function renderNav(){nav.innerHTML=['Today','Training','Reflection','Insights','Calendar','Reminders'].map(x=>`<button class="${tab===x?'active':''}" onclick="tab='${x}';render()">${x}</button>`).join('')}
function allChecks(d){return Object.values(d.checks||{})}
function progress(d){let v=allChecks(d),done=v.filter(Boolean).length,total=Math.max(v.length,1);return {done,total,pct:Math.round(done/total*100)}}
function render(){renderNav();date.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}); if(tab==='Insights'){renderInsights();return} if(tab==='Calendar'){renderCalendar();return} if(tab==='Reminders'){renderReminders();return} let html='';let d=day();
if(tab==='Today'){let p=progress(d);html+=`<div class="card"><div class="row"><b>Today’s progress</b><b>${p.pct}%</b></div><div class="progress"><div class="bar" style="width:${p.pct}%"></div></div><p class="small">${p.done}/${p.total} checklist items completed</p></div>`}
for(const [name,items] of (sections[tab]||[])){html+=`<div class="card section"><h2>${esc(name)}</h2>`;for(const item of items){let id=idFor(tab,name,item);if(tab==='Reflection'){html+=`<label class="check"><span>${esc(item)}</span></label><textarea rows="2" placeholder="Write here..." data-note="${esc(id)}" oninput="day().notes[this.dataset.note]=this.value;save()">${esc(d.notes[id]||'')}</textarea>`}else{html+=`<label class="check"><input type="checkbox" ${d.checks[id]?'checked':''} onchange="day().checks['${esc(id)}']=this.checked;save();render()"><span>${esc(item)}</span></label>`}}html+='</div>'}
if(tab==='Reflection'){html+=`<div class="card"><h2>⭐ Daily effort</h2><div class="row"><div class="score">${d.score||'—'}/10</div><input type="number" min="0" max="10" value="${esc(d.score)}" placeholder="0–10" onchange="day().score=this.value;save();render()"></div><div class="small">Score your effort and consistency, not your worth or perfection.</div></div>`}
content.innerHTML=html}
function renderInsights(){let keys=Object.keys(db.days).sort();let recent=keys.slice(-14);let scores=recent.map(k=>Number(db.days[k].score)||0);let streak=calcStreak();let p=progress(day());let avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:0;let best=Math.max(0,...scores);content.innerHTML=`<div class="grid"><div class="card"><div class="small">Current streak</div><div class="stat">🔥 ${streak} day${streak===1?'':'s'}</div></div><div class="card"><div class="small">Today</div><div class="stat">${p.pct}%</div></div><div class="card"><div class="small">14-day avg effort</div><div class="stat">${avg.toFixed(1)}/10</div></div><div class="card"><div class="small">Best effort</div><div class="stat">${best}/10</div></div></div><div class="card"><h2>Last 14 days</h2><div style="height:180px;display:flex;align-items:end;gap:6px">${recent.map(k=>{let s=Number(db.days[k].score)||0;let pct=s*10;return `<div title="${k}: ${s}/10" style="flex:1;height:${Math.max(4,pct)}%;background:#6d5dfc;border-radius:7px 7px 0 0;min-width:8px"></div>`}).join('')}</div><div class="small" style="display:flex;justify-content:space-between;margin-top:8px"><span>${recent[0]||''}</span><span>${recent[recent.length-1]||''}</span></div></div><div class="card"><h2>Consistency</h2><p>Streaks count consecutive days where you completed at least one checklist item. Your score is an effort score, not a measure of your worth.</p></div>`}
function calcStreak(){let n=0,d=new Date();while(true){let k=d.toLocaleDateString('en-CA'),x=db.days[k];if(!x||!allChecks(x).some(Boolean)){if(n===0 && k===today)n=0;break}n++;d.setDate(d.getDate()-1)}return n}
function renderCalendar(){let base=new Date(today+'T12:00:00');let y=base.getFullYear(),m=base.getMonth();let first=new Date(y,m,1).getDay();let days=new Date(y,m+1,0).getDate();let names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];let cells=names.map(n=>`<div class="calhead">${n}</div>`).join('');for(let i=0;i<first;i++)cells+='<div class="day empty"></div>';for(let d=1;d<=days;d++){let dt=new Date(y,m,d),k=dt.toLocaleDateString('en-CA'),x=db.days[k],done=x&&allChecks(x).some(Boolean);cells+=`<div class="day ${k===today?'today ':''}${done?'done':''}"><b>${d}</b>${done?'<span class="dot"></span>':''}<div class="small">${x&&x.score?x.score+'/10':''}</div></div>`}content.innerHTML=`<div class="card"><h2>📅 ${base.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</h2><div class="calendar">${cells}</div><p class="small">Purple dot/background = a day with saved progress. Scores appear when recorded.</p></div>`}
function renderReminders(){let r=db.settings.reminders;content.innerHTML=`<div class="card"><h2>🔔 Reminders</h2><p class="small">Browser reminders work while this page is open. Some browsers may require notification permission and may limit reminders when the app is closed.</p><button class="btn" onclick="enableNotifications()">Enable notifications</button><div class="settings-row"><b>Morning</b><input type="time" value="${r.morning}" onchange="r.morning=this.value;save()"></div><div class="settings-row"><b>After lunch</b><input type="time" value="${r.lunch}" onchange="r.lunch=this.value;save()"></div><div class="settings-row"><b>Evening routine</b><input type="time" value="${r.evening}" onchange="r.evening=this.value;save()"></div><div class="settings-row"><b>Bedtime</b><input type="time" value="${r.bed}" onchange="r.bed=this.value;save()"></div></div><div class="card"><h2>Suggested reminders</h2><span class="pill">🌅 Morning routine</span><span class="pill">💧 Water / after lunch</span><span class="pill">🦷 Evening teeth</span><span class="pill">📝 Reflection</span><span class="pill">😴 Sleep</span></div>`}
async function enableNotifications(){if(!('Notification' in window)){alert('Notifications are not supported by this browser.');return}let p=await Notification.requestPermission();db.settings.notifications=p==='granted';save();alert(p==='granted'?'Notifications enabled.':'Notification permission was not granted.');}
let lastReminder='';setInterval(()=>{if(!db.settings.notifications||typeof Notification==='undefined'||Notification.permission!=='granted')return;let now=new Date(),hm=now.toTimeString().slice(0,5);let map=db.settings.reminders;let labels={morning:'Morning routine',lunch:'After-lunch routine',evening:'Evening routine + reflection',bed:'Time to prepare for sleep'};for(let k in map){if(map[k]===hm){let token=today+'|'+k+'|'+hm;if(token!==lastReminder){new Notification('Self-Improvement',{body:labels[k]});lastReminder=token}}}},30000);
function resetToday(){if(confirm('Reset all of today’s checks, notes and score?')){db.days[today]=newDay();save();render()}}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
