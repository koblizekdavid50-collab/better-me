<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Better Me</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6750a4">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
:root{
  --primary:#6750a4;
  --primary-container:#eaddff;
  --surface:#fffbfe;
  --surface-container:#f3edf7;
  --outline:#79747e;
  --text:#1d1b20;
  --muted:#79747e;
  --line:rgba(73,69,79,.10);
  --shadow:0 3px 12px rgba(29,27,32,.055);
  font-family:Roboto,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

*,
*::before,
*::after{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-width:0;
  max-width:100%;
  overflow-x:hidden;
}

body{
  min-height:100vh;
  background:#f6f2f7;
  color:var(--text);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  border:0;
}

.app{
  width:100%;
  max-width:none;
  min-width:0;
  min-height:100vh;
  margin:0;
  padding:0 12px 100px;
  background:#f6f2f7;
  color:#1d1b20;
}

.top{
  position:sticky;
  top:0;
  z-index:30;

  width:calc(100% + 24px);
  margin-left:-12px;
  margin-right:-12px;

  min-height:68px;
  padding:10px 12px;

  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  background:rgba(246,242,247,.94);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(73,69,79,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  min-width:0;
}

.brand-mark{
  width:38px;
  height:38px;
  flex:0 0 38px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#7658c9,#5d42a0);
  color:#fff;
  font-weight:900;
  font-size:21px;
  box-shadow:0 5px 14px rgba(103,80,164,.25);
}

.title{
  font-size:20px;
  font-weight:800;
  letter-spacing:-.02em;
}

.sub{
  font-size:12px;
  color:#79747e;
  margin-top:2px;
}

.icon-btn{
  width:42px;
  height:42px;
  flex:0 0 42px;
  padding:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  color:#49454f;
  font-size:23px;
}

.icon-btn:hover{
  background:#ece6f0;
}

.card,
.section{
  width:100%;
  max-width:100%;
  min-width:0;
  margin:12px 0;
  padding:16px;
  background:#fffbfe;
  border:1px solid rgba(73,69,79,.10);
  border-radius:20px;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.section h2,
.card h2{
  font-size:18px;
  margin:0 0 8px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  width:100%;
  min-width:0;
}

.row > *{
  min-width:0;
  max-width:100%;
}

.grid{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.small{
  font-size:12px;
  color:#79747e;
}

.progress{
  width:100%;
  height:10px;
  margin-top:9px;
  background:#e7e0ea;
  border-radius:999px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#6750a4,#8066bd);
  border-radius:999px;
  transition:.2s;
}

.check{
  width:100%;
  min-width:0;
  display:flex;
  align-items:flex-start;
  gap:10px;
  padding:13px 4px;
  border-bottom:1px solid #eee9ef;
  font-size:14px;
  line-height:1.35;
}

.check:last-child{
  border-bottom:0;
}

.check input{
  width:22px;
  height:22px;
  flex:0 0 22px;
  margin:0;
  accent-color:#6750a4;
}

.check span{
  min-width:0;
  overflow-wrap:anywhere;
  word-break:break-word;
}

textarea,
input[type=text],
input[type=number],
input[type=time],
input[type=date],
select{
  width:100%;
  max-width:100%;
  min-width:0;
  padding:11px 12px;
  border-radius:12px;
  border:1px solid #cac4d0;
  background:#f7f2fa;
  color:#1d1b20;
  font:inherit;
  font-size:14px;
}

textarea{
  margin:4px 0 8px;
  resize:vertical;
}

.btn{
  border:1px solid #79747e;
  background:#fffbfe;
  color:#49454f;
  border-radius:999px;
  padding:10px 14px;
  min-height:40px;
  max-width:100%;
  white-space:normal;
}

.btn:active{
  transform:scale(.98);
}

.score{
  font-size:34px;
  font-weight:800;
  color:#6750a4;
}

.pill{
  display:inline-block;
  padding:5px 9px;
  margin:2px;
  border-radius:999px;
  background:#eaddff;
  color:#21005d;
  font-size:12px;
}

.settings-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 105px;
  gap:8px;
  align-items:center;
  margin:10px 0;
}

.settings-row input{
  padding:9px;
}

.calendar{
  width:100%;
  min-width:0;
  display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));
  gap:4px;
}

.calhead{
  min-width:0;
  font-size:10px;
  text-align:center;
  color:#79747e;
  padding:3px;
}

.day{
  min-width:0;
  width:100%;
  min-height:45px;
  border:1px solid #e4dfe6;
  border-radius:8px;
  padding:5px;
  font-size:11px;
  overflow:hidden;
  background:#fffbfe;
}

.day.empty{
  border:0;
  background:transparent;
}

.day.today{
  outline:2px solid #6750a4;
}

.day.done{
  background:#eaddff;
}

.day .dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#6750a4;
  display:inline-block;
  margin-left:2px;
}

.stat{
  font-size:24px;
  font-weight:800;
}

#content{
  width:100%;
  min-width:0;
}

/* Bottom navigation */
.nav{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;

  width:100%;
  max-width:none;
  min-width:0;

  height:76px;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));

  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:4px;

  background:rgba(255,251,254,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(73,69,79,.10);
  box-shadow:0 -4px 18px rgba(29,27,32,.07);
}

.nav button{
  min-width:0;
  width:100%;
  border-radius:16px;
  padding:7px 3px;
  background:transparent;
  color:#49454f;
  font-size:11px;
  font-weight:700;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;

  overflow:hidden;
}

.nav button.active{
  background:#eaddff;
  color:#21005d;
}

.nav button:nth-child(1)::before{
  content:'⌂';
  font-size:17px;
}

.nav button:nth-child(2)::before{
  content:'🏋️';
  font-size:16px;
}

.nav button:nth-child(3)::before{
  content:'✓';
  font-size:17px;
}

.nav button:nth-child(4)::before{
  content:'▥';
  font-size:17px;
}

.nav button:nth-child(5)::before{
  content:'☰';
  font-size:17px;
}

/* Mobile */
@media(max-width:600px){

  .app{
    width:100%;
    max-width:none;
    margin:0;
    padding-left:0;
    padding-right:0;
    padding-bottom:100px;
  }

  .top{
    width:calc(100% + 20px);
    margin-left:-10px;
    margin-right:-10px;
    padding-left:10px;
    padding-right:10px;
  }

  .card,
  .section{
    border-radius:18px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

/* Very small phones */
@media(max-width:430px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .card,
  .section{
    padding:14px;
  }

  .title{
    font-size:19px;
  }

  .settings-row{
    grid-template-columns:minmax(0,1fr) 90px;
  }
}

/* Dark mode */
@media(prefers-color-scheme:dark){

  :root{
    --surface:#211f26;
    --text:#e6e1e9;
    --muted:#cac4d0;
    --line:rgba(230,225,233,.09);
  }

  body{
    background:#141218;
    color:#e6e1e9;
  }

  .app{
    background:#141218;
    color:#e6e1e9;
  }

  .top{
    background:rgba(20,18,24,.94);
    border-bottom-color:rgba(230,225,233,.08);
  }

  .title{
    color:#e6e1e9;
  }

  .sub,
  .small{
    color:#cac4d0;
  }

  .icon-btn{
    color:#cac4d0;
  }

  .card,
  .section{
    background:#211f26;
    border-color:rgba(230,225,233,.09);
  }

  .check{
    border-bottom-color:#302d35;
  }

  .btn{
    background:#211f26;
    color:#e6e1e9;
    border-color:#938f99;
  }

  textarea,
  input[type=text],
  input[type=number],
  input[type=time],
  input[type=date],
  select{
    background:#1c1a20;
    color:#e6e1e9;
    border-color:#49454f;
  }

  .progress{
    background:#38343e;
  }

  .day{
    background:#211f26;
    border-color:#3a363f;
  }

  .day.done{
    background:#4f378b55;
  }

  .nav{
    background:rgba(33,31,38,.96);
    border-top-color:rgba(230,225,233,.08);
  }

  .nav button{
    color:#cac4d0;
  }

  .nav button.active{
    background:#4f378b;
    color:#fff;
  }

  .pill{
    background:#4f378b;
    color:#fff;
  }

  .stat{
    color:#eaddff;
  }
}

  /* FINAL PHONE WIDTH FIX */
html, body {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
  overflow-x: hidden !important;
}

.app {
  width: 100% !important;
  max-width: none !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding-left: 10px !important;
  padding-right: 10px !important;
}

.top {
  width: calc(100% + 20px) !important;
  max-width: none !important;
  margin-left: -10px !important;
  margin-right: -10px !important;
}

.nav {
  width: 100% !important;
  max-width: none !important;
  left: 0 !important;
  right: 0 !important;
  transform: none !important;
}
</style>
</head>

<body>

<main class="app">

  <div class="top">
    <div class="brand">
      <div class="brand-mark">✓</div>
      <div>
        <div class="title">Better Me</div>
        <div class="sub" id="date"></div>
      </div>
    </div>

    <button class="icon-btn" aria-label="Reset today" onclick="resetToday()">↻</button>
  </div>

  <div class="nav" id="nav"></div>

  <div id="content"></div>

</main>

<script>

const KEY = 'better-me-v3';

const DEFAULT_SECTIONS = {
  Today: [
    'Drink enough water',
    'Brush teeth',
    'Floss',
    'Take care of hygiene',
    'Keep room tidy',
    'Read / learn something',
    'Spend time away from phone'
  ],

  Training: [
    'Exercise',
    'Stretch / mobility',
    'Go outside',
    'Get enough sleep'
  ],

  Reflection: [
    'What went well today?',
    'What could I improve?',
    'What am I grateful for?'
  ]
};

let db;

try {
  db = JSON.parse(localStorage.getItem(KEY) || 'null');
} catch (e) {
  db = null;
}

if (!db || typeof db !== 'object') {
  db = {
    days: {},
    settings: {
      reminders: {
        morning: '07:00',
        lunch: '12:30',
        evening: '20:30',
        bed: '22:00'
      },
      notifications: false
    },
    customSections: JSON.parse(JSON.stringify(DEFAULT_SECTIONS))
  };
}

if (!db.days) db.days = {};

if (!db.settings) db.settings = {};

if (!db.settings.reminders) {
  db.settings.reminders = {
    morning: '07:00',
    lunch: '12:30',
    evening: '20:30',
    bed: '22:00'
  };
}

if (!db.customSections) {
  db.customSections =
    JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
}

const todayKey = () => {
  const d = new Date();

  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');

  return `${year}-${month}-${day}`;
};

let today = todayKey();
let tab = 'Today';

function save() {
  localStorage.setItem(KEY, JSON.stringify(db));
}

function newDay() {
  return {
    checks: {},
    notes: {},
    score: '',
    created: Date.now()
  };
}

function day() {
  if (!db.days[today]) {
    db.days[today] = newDay();
    save();
  }

  return db.days[today];
}

function esc(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function idFor(section, item) {
  return `${section}|${item}`;
}

function allChecks(d) {
  return Object.values(d.checks || {});
}

function progress(d) {
  const values = allChecks(d);

  if (!values.length) return 0;

  const done = values.filter(Boolean).length;

  return Math.round((done / values.length) * 100);
}

function getAllItems() {
  const result = [];

  Object.entries(db.customSections).forEach(
    ([section, items]) => {
      items.forEach(item => {
        result.push({
          section,
          item
        });
      });
    }
  );

  return result;
}
function renderNav() {
  const nav = document.getElementById('nav');

  if (!nav) return;

  const tabs = [
    ['Today', 'Today'],
    ['Training', 'Training'],
    ['Reflection', 'Reflection'],
    ['Insights', 'Insights'],
    ['More', 'More']
  ];

  nav.innerHTML = tabs.map(([key, label]) => `
    <button
      class="${tab === key ? 'active' : ''}"
      onclick="setTab('${key}')"
    >
      ${label}
    </button>
  `).join('');
}

function setTab(newTab) {
  tab = newTab;
  render();
  window.scrollTo(0, 0);
}

function toggleCheck(section, item, checked) {
  const d = day();

  d.checks[idFor(section, item)] = checked;

  save();
  render();
}

function updateNote(section, item, value) {
  const d = day();

  if (!d.notes) d.notes = {};

  d.notes[idFor(section, item)] = value;

  save();
}

function render() {
  const nav = document.getElementById('nav');
  const content = document.getElementById('content');
  const date = document.getElementById('date');

  if (!nav || !content) {
    console.error('Better Me: required HTML elements are missing.');
    return;
  }

  renderNav();

  if (date) {
    date.textContent = new Date().toLocaleDateString(
      undefined,
      {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
      }
    );
  }

  if (tab === 'Insights') {
    renderInsights();
    return;
  }

  if (tab === 'Calendar') {
    renderCalendar();
    return;
  }

  if (tab === 'Reminders') {
    renderReminders();
    return;
  }

  if (tab === 'More') {
    renderMore();
    return;
  }

  renderMainTab();
}

function renderMainTab() {
  const content = document.getElementById('content');
  const d = day();

  let html = '';

  const percent = progress(d);

  html += `
    <section class="card">
      <div class="row">
        <div>
          <div class="small">Today's progress</div>
          <div class="score">${percent}%</div>
        </div>

        <div class="pill">
          ${allChecks(d).filter(Boolean).length} completed
        </div>
      </div>

      <div class="progress">
        <div
          class="bar"
          style="width:${percent}%"
        ></div>
      </div>
    </section>
  `;

  const sections = db.customSections[tab] || [];

  sections.forEach(item => {
    const id = idFor(tab, item);
    const checked = !!d.checks[id];

    html += `
      <section class="section">

        <label class="check">

          <input
            type="checkbox"
            ${checked ? 'checked' : ''}
            onchange="
              toggleCheck(
                ${JSON.stringify(tab)},
                ${JSON.stringify(item)},
                this.checked
              )
            "
          >

          <span>
            ${esc(item)}
          </span>

        </label>

      </section>
    `;
  });

  if (tab === 'Reflection') {

    html += `
      <section class="card">

        <h2>Daily reflection</h2>

        <textarea
          rows="5"
          placeholder="Write anything you want to remember..."
          onchange="updateGeneralNote(this.value)"
        >${esc(d.notes.general || '')}</textarea>

      </section>

      <section class="card">

        <h2>Daily score</h2>

        <select onchange="updateScore(this.value)">
          <option value="">Choose a score</option>

          <option value="1"
            ${d.score === '1' ? 'selected' : ''}>
            1 — Rough day
          </option>

          <option value="2"
            ${d.score === '2' ? 'selected' : ''}>
            2
          </option>

          <option value="3"
            ${d.score === '3' ? 'selected' : ''}>
            3 — Okay
          </option>

          <option value="4"
            ${d.score === '4' ? 'selected' : ''}>
            4
          </option>

          <option value="5"
            ${d.score === '5' ? 'selected' : ''}>
            5 — Great day
          </option>
        </select>

      </section>
    `;
  }

  if (!sections.length && tab !== 'Reflection') {
    html += `
      <section class="card">
        <h2>No items yet</h2>
        <p class="small">
          Add some items from More → Customize.
        </p>
      </section>
    `;
  }

  content.innerHTML = html;
}

function updateGeneralNote(value) {
  const d = day();

  if (!d.notes) d.notes = {};

  d.notes.general = value;

  save();
}

function updateScore(value) {
  day().score = value;
  save();
}
function renderInsights() {
  const content = document.getElementById('content');
  const d = day();

  const completed = allChecks(d).filter(Boolean).length;
  const total = allChecks(d).length;
  const streak = calcStreak();
  const daysTracked = Object.keys(db.days).length;
  const average = calculateAverageProgress();

  content.innerHTML = `
    <section class="card">
      <h2>Insights</h2>

      <div class="grid">

        <div class="card">
          <div class="small">Today</div>
          <div class="stat">${progress(d)}%</div>
        </div>

        <div class="card">
          <div class="small">Completed</div>
          <div class="stat">${completed}</div>
        </div>

        <div class="card">
          <div class="small">Streak</div>
          <div class="stat">${streak}</div>
        </div>

        <div class="card">
          <div class="small">Days tracked</div>
          <div class="stat">${daysTracked}</div>
        </div>

      </div>
    </section>

    <section class="card">

      <h2>Average progress</h2>

      <div class="score">${average}%</div>

      <div class="progress">
        <div
          class="bar"
          style="width:${average}%"
        ></div>
      </div>

    </section>

    <section class="card">

      <h2>Today</h2>

      <p class="small">
        ${completed} of ${total} tracked items completed.
      </p>

    </section>
  `;
}


function calculateAverageProgress() {
  const dates = Object.keys(db.days);

  if (!dates.length) return 0;

  let total = 0;

  dates.forEach(key => {
    total += progress(db.days[key]);
  });

  return Math.round(total / dates.length);
}


function calcStreak() {
  let streak = 0;
  const date = new Date();

  while (true) {

    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');

    const key = `${y}-${m}-${d}`;

    const record = db.days[key];

    if (!record || !allChecks(record).some(Boolean)) {
      break;
    }

    streak++;

    date.setDate(date.getDate() - 1);
  }

  return streak;
}


/* =========================
   CALENDAR
========================= */

function renderCalendar() {
  const content = document.getElementById('content');

  const base = new Date(today + 'T12:00:00');

  const year = base.getFullYear();
  const month = base.getMonth();

  const first = new Date(year, month, 1).getDay();
  const days = new Date(year, month + 1, 0).getDate();

  const monthName = base.toLocaleDateString(
    undefined,
    {
      month: 'long',
      year: 'numeric'
    }
  );

  let cells = [
    'Sun',
    'Mon',
    'Tue',
    'Wed',
    'Thu',
    'Fri',
    'Sat'
  ]
    .map(name => `<div class="calhead">${name}</div>`)
    .join('');

  for (let i = 0; i < first; i++) {
    cells += `<div class="day empty"></div>`;
  }

  for (let d = 1; d <= days; d++) {

    const dt = new Date(year, month, d);

    const y = dt.getFullYear();
    const m = String(dt.getMonth() + 1).padStart(2, '0');
    const dayNumber = String(dt.getDate()).padStart(2, '0');

    const key = `${y}-${m}-${dayNumber}`;

    const record = db.days[key];

    const done =
      record &&
      allChecks(record).some(Boolean);

    cells += `
      <div class="day ${key === today ? 'today ' : ''}${done ? 'done' : ''}">
        <b>${d}</b>
        ${done ? '<span class="dot"></span>' : ''}
      </div>
    `;
  }

  content.innerHTML = `
    <section class="card">

      <div class="row">

        <h2>${monthName}</h2>

        <button
          class="btn"
          onclick="setTab('Today')"
        >
          Today
        </button>

      </div>

      <div class="calendar">
        ${cells}
      </div>

    </section>
  `;
}

function setReminder(type, value) {
  db.settings.reminders[type] = value;
  save();
}


async function enableNotifications() {

  if (!('Notification' in window)) {
    alert('Notifications are not supported on this device.');
    return;
  }

  try {

    const permission =
      await Notification.requestPermission();

    if (permission === 'granted') {

      db.settings.notifications = true;

      save();

      alert('Notifications enabled.');

    }

  } catch (e) {
    console.error(e);
  }
}

function renderCustomize() {
  const content = document.getElementById('content');

  let html = `
    <section class="card">

      <h2>Customize</h2>

      <p class="small">
        Add or remove habits and sections.
      </p>
  `;

  Object.entries(db.customSections).forEach(
    ([section, items]) => {

      html += `
        <div style="margin-top:18px">

          <div class="row">

            <strong>${esc(section)}</strong>

            <button
              class="btn"
              onclick="addItem(${JSON.stringify(section)})"
            >
              + Item
            </button>

          </div>
      `;

      items.forEach((item, index) => {

        html += `
          <div
            class="row"
            style="
              margin-top:8px;
              padding:8px 0;
              border-bottom:1px solid var(--line);
            "
          >

            <span style="overflow-wrap:anywhere">
              ${esc(item)}
            </span>

            <button
              class="btn"
              onclick="
                deleteItem(
                  ${JSON.stringify(section)},
                  ${index}
                )
              "
            >
              Delete
            </button>

          </div>
        `;
      });

      html += `</div>`;
    }
  );

  html += `
      <div style="margin-top:20px">

        <button
          class="btn"
          onclick="addSection()"
        >
          + New section
        </button>

      </div>

    </section>
  `;

  content.innerHTML = html;
}


function addItem(section) {
  const item = prompt('Name of the new item:');

  if (!item || !item.trim()) return;

  db.customSections[section].push(item.trim());

  save();

  renderCustomize();
  }


function addItem(section) {
  const item = prompt('Name of the new item:');

  if (!item || !item.trim()) return;

  db.customSections[section].push(item.trim());

  save();

  renderCustomize();
}


function deleteItem(section, index) {

  if (!confirm('Delete this item?')) return;

  db.customSections[section].splice(index, 1);

  save();

  renderCustomize();
}


function addSection() {

  const name = prompt('Name of the new section:');

  if (!name || !name.trim()) return;

  const cleanName = name.trim();

  if (db.customSections[cleanName]) {
    alert('That section already exists.');
    return;
  }

  db.customSections[cleanName] = [];

  save();

  renderCustomize();
}


function resetToday() {

  if (!confirm('Reset all progress for today?')) {
    return;
  }

  db.days[today] = newDay();

  save();

  tab = 'Today';

  render();
}


function resetEverything() {

  if (!confirm('Delete ALL Better Me data?')) {
    return;
  }

  localStorage.removeItem(KEY);

  location.reload();
}


if ('serviceWorker' in navigator) {

  window.addEventListener('load', () => {

    navigator.serviceWorker
      .register('./sw.js')
      .then(() => {
        console.log('Better Me service worker registered.');
      })
      .catch(error => {
        console.log(
          'Service worker registration failed:',
          error
        );
      });

  });

}


render();
